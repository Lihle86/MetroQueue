<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetroQueue SA - National Public Service Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f4f6f9;
            color: #1e293b;
            padding-bottom: 100px;
            -webkit-text-size-adjust: 100%;
        }
        h1 {
            font-size: 26px;
            color: #0f172a;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .my-ticket-banner {
            display: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        
        /* MULTI-PAGE STEP WIZARD CONTAINER */
        .search-engine-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .search-engine-box h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wizard-step {
            display: none; /* Hidden by default, controlled via JS pages toggle */
        }
        .wizard-step.active {
            display: block; /* Show only current step */
        }
        .step-indicator {
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .input-field {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 16px; /* 16px prevents automatic iOS zoom-in distortion */
            color: #0f172a;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
        }

        /* NAVIGATION ACTION CONTROLS */
        .wizard-nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .nav-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .nav-btn:active { opacity: 0.8; }
        .btn-back {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-next {
            background-color: #2563eb;
            color: white;
        }
        .btn-submit {
            background-color: #16a34a;
            color: white;
        }

        /* LIVE DEPLOYED MONITOR CARDS */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border-left: 8px solid #cbd5e1;
            border: 1px solid #e2e8f0;
            border-left: 8px solid #cbd5e1;
            position: relative;
        }
        .CRITICAL { border-left-color: #ef4444; } 
        .HIGH { border-left-color: #f97316; }     
        .MEDIUM { border-left-color: #eab308; }   
        .LOW { border-left-color: #22c55e; }      

        .dept-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
        }
        .badge {
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .badge-CRITICAL { background-color: #ef4444; }
        .badge-HIGH { background-color: #f97316; }
        .badge-MEDIUM { background-color: #eab308; }
        .badge-LOW { background-color: #22c55e; }

        .live-counter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            margin-top: 14px;
            text-align: center;
            border: 1px solid #f1f5f9;
        }
        .counter-box {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }
        .counter-number {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }
        .details {
            margin-top: 14px;
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
        }
        .rating-metrics-display {
            margin-top: 12px;
            font-weight: 700;
            font-size: 13px;
            color: #16a34a;
            background: #f0fdf4;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #dcfce7;
        }
        .warning-text {
            color: #b91c1c;
            font-weight: 700;
            margin-top: 12px;
            font-size: 13px;
            background: #fef2f2;
            padding: 6px 10px;
            border-radius: 8px;
            display: block;
            border: 1px solid #fee2e2;
        }

        /* GUARD PANEL MOBILE ENHANCEMENTS */
        .guard-control-station {
            margin-top: 16px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
        }
        .guard-title {
            font-size: 12px;
            font-weight: 800;
            color: #475569;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .guard-btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .guard-btn-row:last-child { margin-bottom: 0; }
        .shift-btn {
            flex: 1;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .shift-btn:active { opacity: 0.9; }
        .shift-btn.next { background-color: #0f172a; }

        /* CITIZEN BOOKING ACTIONS PANEL */
        .join-line-btn {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            margin-top: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.15);
        }
        .join-line-btn:active { background-color: #1d4ed8; }
        
        .civic-actions-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .complaint-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .rate-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* FIXED APP NAVIGATION BASE TRAY */
        .btn-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            padding: 12px 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
            border-top: 1px solid #e2e8f0;
        }
        .report-btn, .guard-portal-btn {
            width: 44%;
            color: white;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            padding: 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .report-btn { background-color: #2563eb; }
        .guard-portal-btn { background-color: #475569; }
    </style>
</head>
<body>

    <h1>MetroQueue SA</h1>
